name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      # versionCode растёт с каждой сборкой — Android принимает только более новую версию
      - run: gradle assembleRelease -PverCode=${{ github.run_number }}
      - run: cp app/build/outputs/apk/release/app-release.apk exit-country.apk
      - uses: actions/upload-artifact@v4
        with: { name: exit-country.apk, path: exit-country.apk }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest exit-country.apk --target "$GITHUB_SHA" \
            --title "Exit Country Widget (сборка ${{ github.run_number }})" \
            --notes "Последняя версия. Установить поверх старой — данные и виджет сохранятся."
