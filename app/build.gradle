plugins { id 'com.android.application' }
android {
    namespace 'app.exitcountry'
    compileSdk 34
    defaultConfig {
        applicationId 'app.exitcountry'
        minSdk 26
        targetSdk 34
        versionCode = Integer.parseInt((project.findProperty('verCode') ?: '2').toString())
        versionName '1.1'
    }
    signingConfigs {
        shared {
            // общий ключ: каждая сборка подписана одинаково → обновление ставится поверх старой версии
            storeFile file('../keystore/release.jks')
            storePassword 'exitcountry'
            keyAlias 'exitcountry'
            keyPassword 'exitcountry'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release { signingConfig signingConfigs.shared }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
